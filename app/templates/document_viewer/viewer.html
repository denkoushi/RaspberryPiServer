<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Document Viewer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f172a;
      --panel: #111c38;
      --accent: #0ea5e9;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      font-family: "Segoe UI", "ヒラギノ角ゴ ProN", sans-serif;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid rgba(148, 163, 184, 0.1);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 1rem;
    }

    header h1 {
      margin: 0;
      font-size: 1.1rem;
      color: var(--text-muted);
      flex: 1 1 auto;
    }

    .status-pill {
      border-radius: 999px;
      padding: 0.25rem 0.9rem;
      font-size: 0.85rem;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: rgba(148, 163, 184, 0.15);
    }

    .status-pill.is-live {
      color: var(--success);
    }

    .status-pill.is-offline {
      color: var(--danger);
    }

    main {
      flex: 1 1 auto;
      display: grid;
      grid-template-columns: minmax(280px, 340px) 1fr;
      gap: 1.5rem;
      padding: 1.5rem;
    }

    @media (max-width: 1024px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .panel {
      background: var(--panel);
      border-radius: 16px;
      padding: 1.25rem;
      box-shadow: 0 12px 40px rgba(15, 23, 42, 0.35);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    label {
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    input[type="text"] {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      color: var(--text);
      font-size: 1rem;
    }

    button {
      appearance: none;
      border: none;
      border-radius: 12px;
      padding: 0.7rem 1rem;
      font-size: 1rem;
      color: #0f172a;
      background: var(--accent);
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.35);
    }

    .meta {
      font-size: 0.85rem;
      color: var(--text-muted);
      display: grid;
      gap: 0.4rem;
    }

    .message {
      margin-top: 1rem;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .message.is-error {
      color: var(--danger);
    }

    .viewer-wrapper {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      background: rgba(15, 23, 42, 0.8);
      margin-bottom: 1rem;
      min-height: 320px;
    }

    iframe {
      width: 100%;
      height: 78vh;
      min-height: 420px;
      border: none;
      display: block;
    }

    #docViewerOverlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      padding: 1rem;
      transition: opacity 0.2s ease;
    }

    #docViewerOverlay.is-hidden {
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }

    .overlay-spinner {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      border: 4px solid rgba(14, 165, 233, 0.35);
      border-top-color: var(--accent);
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    #docViewerSummary {
      border-radius: 12px;
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid rgba(148, 163, 184, 0.12);
      padding: 1rem;
      display: grid;
      gap: 0.6rem;
    }

    #docViewerSummary h2 {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin: 0;
      font-weight: 500;
    }

    #docViewerSummary dl {
      margin: 0;
      display: grid;
      gap: 0.4rem;
    }

    #docViewerSummary dt {
      font-size: 0.75rem;
      color: rgba(148, 163, 184, 0.8);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    #docViewerSummary dd {
      margin: 0;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Document Viewer (RaspberryPiServer)</h1>
    <span id="socketStatus" class="status-pill is-offline">● OFFLINE</span>
    <span id="docStatus" class="status-pill">状態: 表示待ち</span>
  </header>
  <main>
    <section class="panel">
      <form id="lookupForm">
        <div>
          <label for="partInput">部品番号 / Part Number</label>
          <input id="partInput" name="part" type="text" autocomplete="off" placeholder="例: TEST-001" />
        </div>
        <button type="submit">PDF を表示</button>
      </form>
      <div class="meta" id="metaInfo">
        <span>最後に表示した部品番号: <strong id="metaPart">-</strong></span>
        <span>最終更新: <strong id="metaUpdated">-</strong></span>
      </div>
      <p id="message" class="message">左側ペインでスキャンすると自動で表示が切り替わります。</p>
    </section>
    <section class="panel">
      <div class="viewer-wrapper">
        <iframe id="viewerFrame" title="PDF viewer"></iframe>
        <div id="docViewerOverlay" class="is-hidden">
          <span class="overlay-spinner" aria-hidden="true"></span>
          <p id="docViewerOverlayMessage">待機中です。</p>
        </div>
      </div>
      <div id="docViewerSummary">
        <h2>最新のスキャン結果</h2>
        <dl>
          <div>
            <dt>部品番号</dt>
            <dd id="summaryPart">-</dd>
          </div>
          <div>
            <dt>ロケーション</dt>
            <dd id="summaryLocation">-</dd>
          </div>
          <div>
            <dt>端末</dt>
            <dd id="summaryDevice">-</dd>
          </div>
          <div>
            <dt>スキャン時刻</dt>
            <dd id="summaryScannedAt">-</dd>
          </div>
        </dl>
      </div>
    </section>
</main>

  <script src="{{ url_for('static', filename='js/socket.io.min.js') }}"></script>
  <script>
    const CONFIG = {{ config | tojson }};
    const partInput = document.getElementById("partInput");
    const form = document.getElementById("lookupForm");
    const frame = document.getElementById("viewerFrame");
    const message = document.getElementById("message");
    const metaPart = document.getElementById("metaPart");
    const metaUpdated = document.getElementById("metaUpdated");
    const docStatus = document.getElementById("docStatus");
    const socketStatus = document.getElementById("socketStatus");
    const overlay = document.getElementById("docViewerOverlay");
    const overlayMessage = document.getElementById("docViewerOverlayMessage");
    const overlaySpinner = overlay ? overlay.querySelector(".overlay-spinner") : null;
    const summaryPart = document.getElementById("summaryPart");
    const summaryLocation = document.getElementById("summaryLocation");
    const summaryDevice = document.getElementById("summaryDevice");
    const summaryScannedAt = document.getElementById("summaryScannedAt");

    let lastResult = null;
    let lastStation = null;
    let lastScanEvent = null;

    const notifyParent = (payload) => {
      if (!window.parent) return;
      try {
        window.parent.postMessage(payload, "*");
      } catch (error) {
        console.warn("postMessage failed:", error);
      }
    };

    const updateViewerState = (state, part = null) => {
      notifyParent({
        type: "viewer-state",
        state,
        part: part || null,
        station: lastStation,
      });
    };

    const hideOverlay = () => {
      if (!overlay) return;
      overlay.classList.add("is-hidden");
      if (overlaySpinner) {
        overlaySpinner.style.display = "inline-block";
      }
    };

    const showOverlay = (text, { showSpinner = true } = {}) => {
      if (!overlay) return;
      if (overlayMessage) {
        overlayMessage.textContent = text;
      }
      overlay.classList.remove("is-hidden");
      if (overlaySpinner) {
        overlaySpinner.style.display = showSpinner ? "inline-block" : "none";
      }
    };

    const resetSummary = () => {
      summaryPart.textContent = "-";
      summaryLocation.textContent = "-";
      summaryDevice.textContent = "-";
      summaryScannedAt.textContent = "-";
    };

    const updateSummary = (payload) => {
      if (!payload) {
        resetSummary();
        return;
      }
      summaryPart.textContent = payload.order_code || payload.part || "-";
      summaryLocation.textContent = payload.location_code || "-";
      summaryDevice.textContent = payload.device_id || "-";
      summaryScannedAt.textContent = payload.scanned_at
        ? new Date(payload.scanned_at).toLocaleString()
        : "-";
    };

    async function fetchDocument(partNumber) {
      if (!partNumber) {
        setMessage("部品番号を入力してください。", true);
        updateViewerState("idle");
        return;
      }
      setMessage("検索中…", false);
      docStatus.textContent = "状態: 取得中";
      updateViewerState("searching", partNumber);
      showOverlay("PDF を読み込み中です…");

      try {
        const url = `${CONFIG.api_base}/${encodeURIComponent(partNumber)}`;
        const headers = CONFIG.api_token
          ? { Authorization: `Bearer ${CONFIG.api_token}` }
          : {};

        const response = await fetch(url, { headers });
        const data = await response.json();

        if (!response.ok || !data.found) {
          setMessage("PDF が見つかりません。USB 取り込みとファイル名をご確認ください。", true);
          docStatus.textContent = "状態: 見つからない";
          frame.src = "";
          updateViewerState("error", partNumber);
          showOverlay("PDF が見つかりません。USB 取り込みとファイル名をご確認ください。", {
            showSpinner: false,
          });
          return;
        }

        lastResult = {
          part: partNumber,
          filename: data.filename,
          url: data.url.startsWith("http") ? data.url : `${CONFIG.docs_base}/${data.filename}`,
          timestamp: new Date().toISOString(),
        };

        frame.src = lastResult.url;
        metaPart.textContent = partNumber;
        metaUpdated.textContent = new Date().toLocaleString();
        docStatus.textContent = "状態: 表示中";
        setMessage(`表示中: ${data.filename}`, false);
        updateViewerState("viewer", partNumber);
        hideOverlay();
        if (lastScanEvent) {
          updateSummary(lastScanEvent);
        }
        notifyParent({
          type: "dv-barcode",
          part: partNumber,
        });
      } catch (error) {
        console.error(error);
        setMessage("サーバーへの接続に失敗しました。ネットワークとログをご確認ください。", true);
        docStatus.textContent = "状態: エラー";
        updateViewerState("error", partNumber);
        showOverlay("サーバーへの接続に失敗しました。ネットワークとログをご確認ください。", {
          showSpinner: false,
        });
      }
    }

    function setMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle("is-error", isError);
      notifyParent({
        type: "viewer-message",
        level: isError ? "error" : "info",
        text,
        part: lastResult?.part || null,
      });
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      fetchDocument(partInput.value.trim());
    });

    // --- Socket.IO 連携 ---
    if (window.io) {
      try {
        const socket = io(CONFIG.socket_base, { path: CONFIG.socket_path });
        socket.on("connect", () => {
          socketStatus.textContent = "● LIVE";
          socketStatus.classList.remove("is-offline");
          socketStatus.classList.add("is-live");
          if (
            overlay &&
            !overlay.classList.contains("is-hidden") &&
            overlayMessage.textContent.includes("Socket.IO")
          ) {
            hideOverlay();
          }
        });
        socket.on("disconnect", () => {
          socketStatus.textContent = "● OFFLINE";
          socketStatus.classList.add("is-offline");
          socketStatus.classList.remove("is-live");
          showOverlay("Socket.IO に接続できません。再接続を待機しています…");
        });

        socket.on("part_location_updated", (payload) => {
          if (payload && payload.order_code) {
            lastScanEvent = payload;
            updateSummary(payload);
            showOverlay("PDF を読み込み中です…");
            fetchDocument(payload.order_code);
          }
        });
      } catch (error) {
        console.warn("Socket.IO 接続に失敗しました:", error);
        socketStatus.textContent = "● OFFLINE";
        socketStatus.classList.add("is-offline");
        setMessage("Socket.IO に接続できませんでした。REST ポーリングのみで動作します。", true);
        showOverlay("Socket.IO に接続できませんでした。REST ポーリングのみで動作します。", {
          showSpinner: false,
        });
      }
    } else {
      console.warn("Socket.IO クライアントが読み込めませんでした。");
      socketStatus.textContent = "● OFFLINE";
      socketStatus.classList.add("is-offline");
      setMessage("Socket.IO が読み込めなかったため、REST ポーリングのみで動作します。", true);
      showOverlay("Socket.IO が読み込めなかったため、REST ポーリングのみで動作します。", {
        showSpinner: false,
      });
    }

    // クエリパラメータで part を指定できるようにする
    const params = new URLSearchParams(location.search);
    const initialPart = params.get("part") || "";
    if (initialPart) {
      partInput.value = initialPart;
      fetchDocument(initialPart);
    } else {
      updateViewerState("idle");
      hideOverlay();
    }

    window.addEventListener("message", (event) => {
      const data = event.data;
      if (!data || typeof data !== "object") return;

      if (data.type === "station-change") {
        lastStation = {
          process: data.process || "",
          available: Array.isArray(data.available) ? data.available : [],
          updated_at: data.updated_at || null,
        };
        const info = [];
        if (lastStation.process) info.push(`工程: ${lastStation.process}`);
        if (lastStation.available.length) info.push(`候補: ${lastStation.available.join(", ")}`);
        if (info.length) {
          setMessage(info.join(" / "), false);
        }
      } else if (data.type === "focus-request") {
        partInput?.focus();
      } else if (data.type === "viewer-return") {
        lastResult = null;
        frame.src = "";
        metaPart.textContent = "-";
        metaUpdated.textContent = "-";
        resetSummary();
        setMessage("待機中です。部品番号を入力してください。", false);
        docStatus.textContent = "状態: 待機中";
        updateViewerState("idle");
        showOverlay("待機中です。部品番号を入力してください。", { showSpinner: false });
      }
    });
  </script>
</body>
</html>
